services:
  next-app:
    build: .
    container_name: nextjs-app
    ports:
      - "11315:3000"

    # Uploads directory mounted inside user's home
    volumes:
      - ./uploads:/home/appuser/app/uploads:rw,noexec,nosuid,nodev

    # Environment variables
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env

    # Run as non-root user
    user: "1001:1001"

    # Security hardening
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Restart policy
    restart: unless-stopped
